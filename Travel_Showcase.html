<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travel Showcase</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <link rel="stylesheet" href="travel_showcase.css" />
</head>
<body>
<main class="py-5">
  <div class="container">
    <h3 class="mb-4 text-center">Discover Destinations</h3>

    <div id="destCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="3000">
          <img src="A_high-resolution_digital_photograph_with_a_slight.png" class="d-block w-100" alt="beach">
          <div class="carousel-caption d-none d-md-block">
            <h5>Sunset Beach</h5>
            <p>Relax and recharge.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="4000">
          <img src="A_high-resolution_digital_photograph_showcases_fou.png" class="d-block w-100" alt="mountain">
          <div class="carousel-caption d-none d-md-block">
            <h5>Mountain Retreat</h5>
            <p>Hikes and fresh air.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3500">
          <img src="A_digital_photograph_product_photograph_displays_e.png" class="d-block w-100" alt="city">
          <div class="carousel-caption d-none d-md-block">
            <h5>City Escape</h5>
            <p>Cultural hotspots and cuisine.</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#destCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#destCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <label class="form-label">Booking progress</label>
    <div class="progress mb-4" style="height:18px;">
      <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width:70%;">70%</div>
    </div>

    <footer class="text-center small text-muted">Contact: travel@agency.com</footer>
  </div>
</main>

</body>
</html>
