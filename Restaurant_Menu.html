<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Restaurant Menu</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <link rel="stylesheet" href="restaurant_menu.css" />
</head>
<body>
<main class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Today's Menu</h2>
    <div class="row">
      <div class="col-lg-8">
        <table class="table table-striped">
          <thead><tr><th>Item</th><th>Category</th><th class="text-end">Price</th></tr></thead>
          <tbody>
            <tr><td>Margherita Pizza</td><td>Vegetarian</td><td class="text-end">₹299</td></tr>
            <tr><td>Grilled Salmon</td><td>Non-Veg</td><td class="text-end">₹499</td></tr>
            <tr><td>Caesar Salad</td><td>Starter</td><td class="text-end">₹199</td></tr>
          </tbody>
        </table>
        <h5 class="mt-4">Chef's Specials</h5>
        <ul class="list-group mb-3">
          <li class="list-group-item">Truffle Pasta - Limited</li>
          <li class="list-group-item">Lamb Shank - Slow cooked</li>
        </ul>
      </div>
      <div class="col-lg-4 text-center">
        <figure>
          <img src="A_digital_photograph_product_photograph_displays_e.png" class="img-fluid rounded" alt="food">
          <figcaption class="small text-muted mt-2">Today’s special dish.</figcaption>
        </figure>
      </div>
    </div>
  </div>
</main>

</body>
</html>
