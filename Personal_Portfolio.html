<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Personal Portfolio</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <link rel="stylesheet" href="personal_portfolio.css" />
</head>
<body>
<header class="bg-white">
  <div class="container py-4 text-center">
    <h1 class="fw-bold">Akshat Tripathi</h1>
    <p class="text-muted">Data Analyst · Web Developer · Problem Solver</p>
  </div>
</header>

<main>
  <section class="container text-center py-5">
    <img src="A_high-resolution_digital_photograph_showcases_fou.png" class="img-fluid rounded-circle mb-3" alt="profile" width="160">
    <p class="lead">I turn data into actionable insights and build beautiful interfaces.</p>
    <div class="d-flex justify-content-center gap-2 mb-3">
      <a class="btn btn-primary">Hire Me</a>
      <a class="btn btn-outline-secondary">Download CV</a>
    </div>

    <form class="mx-auto" style="max-width:420px;">
      <div class="mb-3">
        <input class="form-control" placeholder="Your email" />
      </div>
      <div class="mb-3">
        <textarea class="form-control" rows="3" placeholder="Project details"></textarea>
      </div>
      <button class="btn btn-success">Send</button>
    </form>
  </section>
</main>

<footer class="text-center py-4 small text-muted">Made with Bootstrap · Contact: akshat@example.com</footer>

</body>
</html>
