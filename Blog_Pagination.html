<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog Pagination</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <link rel="stylesheet" href="blog_pagination.css" />
</head>
<body>
<main class="py-5">
  <div class="container">
    <h3>Blog Posts</h3>
    <div class="mb-4">
      <article class="mb-3">
        <h5>Post One</h5><p class="text-muted small">Short excerpt for the first post.</p>
      </article>
      <article class="mb-3">
        <h5>Post Two</h5><p class="text-muted small">Short excerpt for the second post.</p>
      </article>
    </div>

    <nav aria-label="Page navigation">
      <ul class="pagination justify-content-center">
        <li class="page-item"><a class="page-link">Previous</a></li>
        <li class="page-item"><a class="page-link">1</a></li>
        <li class="page-item"><a class="page-link">2</a></li>
        <li class="page-item"><a class="page-link">Next</a></li>
      </ul>
    </nav>

    <div class="d-flex justify-content-between mt-3">
      <button class="btn btn-outline-secondary">Older Posts</button>
      <button class="btn btn-outline-secondary">Newer Posts</button>
    </div>
  </div>
</main>

</body>
</html>
