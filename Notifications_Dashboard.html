<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notifications Dashboard</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <link rel="stylesheet" href="notifications_dashboard.css" />
</head>
<body>
<main class="py-5">
  <div class="container">
    <h3>Notifications</h3>
    <div class="card p-3">
      <div class="alert alert-success" role="alert">You have 3 new messages.</div>
      <div class="alert alert-info" role="alert">Tip: Use keyboard shortcuts to increase speed.</div>
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        Server CPU usage is high.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <div class="bg-light border p-3 mt-3">
        <strong>Summary</strong>
        <p class="mb-0 text-muted small">Pending items: 7 · Unread messages: 3</p>
      </div>
    </div>
  </div>
</main>

</body>
</html>
