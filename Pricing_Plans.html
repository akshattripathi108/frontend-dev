<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pricing Plans</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <link rel="stylesheet" href="pricing_plans.css" />
</head>
<body>
<main class="py-5">
  <div class="container">
    <h3 class="mb-4 text-center">Choose Your Plan</h3>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100 p-3">
          <h5>Basic</h5>
          <p class="display-6">₹499</p>
          <ul>
            <li>1 project</li><li>Email support</li>
          </ul>
          <a class="btn btn-outline-primary">Select</a>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 p-3 bg-primary text-white">
          <h5>Pro</h5>
          <p class="display-6">₹1299</p>
          <ul>
            <li>Unlimited projects</li><li>Priority support</li>
          </ul>
          <a class="btn btn-light">Select</a>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 p-3">
          <h5>Enterprise</h5>
          <p class="display-6">Contact</p>
          <ul>
            <li>Custom solutions</li><li>Dedicated support</li>
          </ul>
          <a class="btn btn-outline-primary">Contact</a>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
